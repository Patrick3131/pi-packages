name: Publish private Pi toolkit
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@patrick3131'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.RELEASE_TAG !== "v"+p.version) throw new Error("Tag must match package version");'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:research
      - run: npm pack --dry-run
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify private release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /users/Patrick3131/packages/npm/pi-packages --jq .visibility)" = private
          npm view "@patrick3131/pi-packages@$(node -p 'require("./package.json").version')" version dist.integrity --json
